name: Edu feature checks
on:
  pull_request:
    paths:
      - 'app.js'
      - 'forge-ide.css'
      - 'forge-focus.css'
      - 'forge-classroom.css'
      - 'forge-form-test.js'
      - 'card-source-viewer.js'
      - 'forge-monaco.js'
      - 'engine.js'
      - 'index.html'
      - 'network.js'
      - 'local-online.js'
      - 'edu-decks.js'
      - 'tests/**'
      - '.github/workflows/edu-ci.yml'
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check app.js
          node --check engine.js
          node --check local-online.js
          node --check edu-decks.js
          node --check edu-card-crypto.js
          node --check card-source-viewer.js
          node --check forge-form-test.js
          node tests/engine.test.js
          node tests/edu-encryption.test.js
          node tests/forge-ide-layout.test.js
          node tests/forge-form-test.test.js
          node tests/edu-local.test.js
          node tests/card-forge-modes.test.js
          node tests/card-editor-ui.test.js
          node tests/site-config-api-guide.test.js
